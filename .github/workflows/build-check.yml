name: Build Check

# chirpy 마이그레이션 브랜치에서 빌드만 검증 (배포하지 않음).
# 검증이 끝나 main으로 병합하면 이 파일은 제거해도 된다.
on:
  push:
    branches:
      - chirpy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site (검증용)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
